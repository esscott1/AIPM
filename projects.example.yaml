# Example AIPM registry. The real one is projects.yaml, which fleet tools write
# (/adopt-project, create_project, pause, resume, /retire-project) and which
# stays out of git. Per-run state (session_id, last_seen_commit) lives in
# fleet/sessions.json, not here.
projects:
  montecarlo:
    path: C:\src\MonteCarlo
    remote: https://github.com/esscott1/MonteCarlo.git
    goal: Featured portfolio project; client-ready simulation
    model: sonnet
    permission_mode: acceptEdits   # plan | acceptEdits; bypassPermissions is rejected
    budget:
      max_tokens_per_job: 100000   # default; a job over it is flagged, not stopped
      # max_turns: 40              # optional; unset means no turn limit
    status: active                 # active | paused
